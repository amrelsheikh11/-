<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إيصال مستحقات عملاء</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #27ae60;
            --bg-color: #f4f6f7;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .receipt-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            border-top: 8px solid var(--secondary-color);
            position: relative;
        }

        .receipt-header {
            text-align: center;
            border-bottom: 2px dashed #e0e0e0;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .receipt-header h2 {
            margin: 0;
            color: var(--primary-color);
            font-size: 24px;
        }

        .receipt-header p {
            margin: 5px 0 0 0;
            color: #7f8c8d;
            font-size: 14px;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .receipt-label {
            color: #7f8c8d;
            font-weight: 600;
        }

        .receipt-value {
            color: var(--primary-color);
            font-weight: bold;
        }

        .amount-box {
            background-color: #e8f8f5;
            border: 1px solid #a3e4d7;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
        }

        .amount-box span {
            display: block;
            color: var(--secondary-color);
            font-size: 28px;
            font-weight: 800;
        }

        .receipt-footer {
            text-align: center;
            border-top: 2px dashed #e0e0e0;
            padding-top: 20px;
            margin-top: 20px;
            font-size: 14px;
            color: #95a5a6;
        }

        .btn-print {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(44, 62, 80, 0.2);
            transition: all 0.3s ease;
        }

        .btn-print:hover {
            background-color: #34495e;
            transform: translateY(-2px);
        }

        @media print {
            body {
                background-color: white;
                padding: 0;
            }
            .receipt-container {
                box-shadow: none;
                border: none;
                max-width: 100%;
            }
            .btn-print {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="receipt-container">
        <div class="receipt-header">
            <h2>إيصال مستحقات عملاء</h2>
            <p>Cash Receipt Certificate</p>
        </div>

        <div class="receipt-row">
            <span class="receipt-label">رقم الإيصال:</span>
            <span class="receipt-value">#REC-2026-001</span>
        </div>

        <div class="receipt-row">
            <span class="receipt-label">التاريخ:</span>
            <span class="receipt-value" id="current-date">23 / 09 / 2026</span>
        </div>

        <div class="receipt-row">
            <span class="receipt-label">إستلمنا من السيد/ة:</span>
            <span class="receipt-value">عميل كود 101</span>
        </div>

        <div class="receipt-row">
            <span class="receipt-label">وذلك عن المستحقات:</span>
            <span class="receipt-value">تسوية حساب خدمات برمجية</span>
        </div>

        <div class="amount-box">
            <span class="receipt-label" style="color: #16a085; font-size: 14px;">المبلغ المدفوع / Amount</span>
            <span>5,000 ج.م</span>
        </div>

        <div class="receipt-footer">
            <p>شكراً لتعاملكم معنا</p>
            <p style="font-size: 11px;">تم التوليد تلقائياً عبر النظام</p>
        </div>
    </div>

    <button class="btn-print" onclick="window.print()">طباعة الإيصال / حفظ PDF</button>

    <script>
        // تحديث التاريخ تلقائياً لتاريخ اليوم
        const today = new Date();
        const dateString = today.getDate() + ' / ' + (today.getMonth() + 1) + ' / ' + today.getFullYear();
        document.getElementById('current-date').innerText = dateString;
    </script>

</body>
</html>
